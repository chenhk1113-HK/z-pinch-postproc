name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: pytest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openmc || true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openmc || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Download nuclear cross sections (ENDF/B-VIII.0)
        run: |
          python scripts/download_cross_sections.py
        env:
          OPENMC_CROSS_SECTIONS: data/nuclear_data/ace/cross_sections.xml

      - name: Run test suite
        run: |
          pytest tests/ -q --tb=short --maxfail=10
        env:
          OPENMC_CROSS_SECTIONS: data/nuclear_data/ace/cross_sections.xml

      - name: Coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          pytest tests/ -q --cov=code --cov-report=term-missing --cov-fail-under=50